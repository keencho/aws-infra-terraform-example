name: Deploy Admin and User to S3

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies for Root Project
        working-directory: react
        run: npm install

      - name: Build Admin
        working-directory: react/app/admin
        run: npm run build:production

      - name: Build User
        working-directory: react/app/user
        run: npm run build:production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Remove Exist & Upload New to S3
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }}/admin --recursive
          aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }}/user --recursive
          aws s3 cp react/app/admin/dist s3://${{ secrets.S3_BUCKET_NAME }}/admin --recursive
          aws s3 cp react/app/user/dist s3://${{ secrets.S3_BUCKET_NAME }}/user --recursive

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_ADMIN }} --paths "/*"'
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_USER }} --paths "/*"'
